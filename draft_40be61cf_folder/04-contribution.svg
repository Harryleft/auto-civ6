<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270">
<rect width="1200" height="1270" fill="#FAFBFD"/>
<g font-family="Noto Sans SC, PingFang SC, sans-serif" fill="#172B46">
<text x="50" y="55" font-size="34" font-weight="700">案例三｜一次贡献，为什么会卡住整条任务链？</text>
<text x="50" y="100" font-size="24" fill="#546579">皇家学会：建造者消耗全部劳动力，换取当前城市的航天项目进度</text>
<line x1="610" y1="145" x2="610" y2="1130" stroke="#D6DEE8" stroke-width="2"/>
<circle cx="72" cy="162" r="9" fill="#C64949"/>
<text x="95" y="171" font-size="28" font-weight="700" fill="#A73737">修复前｜两种不同的故障</text>
<circle cx="670" cy="162" r="9" fill="#256BB7"/>
<text x="692" y="171" font-size="28" font-weight="700" fill="#205E9E">修复后｜单次提交，持续确认</text>

<text x="75" y="220" font-size="23" font-weight="700" fill="#A73737">A．把“暂未更新”当成“没有执行”</text>
<rect x="75" y="245" width="490" height="80" rx="16" fill="#FFFFFF" stroke="#B8C5D4" stroke-width="2"/>
<text x="320" y="294" font-size="26" text-anchor="middle">首次发送贡献命令</text>
<line x1="320" y1="325" x2="320" y2="355" stroke="#B15C5C" stroke-width="2"/><polygon points="314,351 326,351 320,361" fill="#B15C5C"/>
<rect x="75" y="365" width="490" height="80" rx="16" fill="#FFF3F1" stroke="#D68982" stroke-width="2"/>
<text x="320" y="414" font-size="26" text-anchor="middle">立即回读：劳动力还没变化</text>
<line x1="320" y1="445" x2="320" y2="475" stroke="#B15C5C" stroke-width="2"/><polygon points="314,471 326,471 320,481" fill="#B15C5C"/>
<rect x="75" y="485" width="490" height="105" rx="16" fill="#FBE7E5" stroke="#C64949" stroke-width="2"/>
<text x="320" y="527" font-size="26" text-anchor="middle"><tspan x="320">重发／Immediate 回退</tspan><tspan x="320" dy="36">重复消耗与状态失配风险</tspan></text>

<text x="75" y="650" font-size="23" font-weight="700" fill="#A73737">B．T231：保护门禁反而挡住了解锁</text>
<rect x="75" y="680" width="490" height="90" rx="16" fill="#FFFFFF" stroke="#B8C5D4" stroke-width="2"/>
<text x="320" y="718" font-size="26" text-anchor="middle"><tspan x="320">贡献只提交一次</tspan><tspan x="320" dy="33">项目弹窗持有引擎事件</tspan></text>
<line x1="320" y1="770" x2="320" y2="800" stroke="#B15C5C" stroke-width="2"/><polygon points="314,796 326,796 320,806" fill="#B15C5C"/>
<rect x="75" y="815" width="490" height="90" rx="16" fill="#FFF3F1" stroke="#D68982" stroke-width="2"/>
<text x="320" y="853" font-size="26" text-anchor="middle"><tspan x="320">贡献仍未确认</tspan><tspan x="320" dy="33">门禁阻止关闭弹窗</tspan></text>
<line x1="320" y1="905" x2="320" y2="935" stroke="#B15C5C" stroke-width="2"/><polygon points="314,931 326,931 320,941" fill="#B15C5C"/>
<ellipse cx="320" cy="1000" rx="245" ry="58" fill="#FBE7E5" stroke="#C64949" stroke-width="2"/>
<text x="320" y="990" font-size="25" text-anchor="middle"><tspan x="320">引擎等关闭；确认等引擎</tspan><tspan x="320" dy="35" font-weight="700">循环等待</tspan></text>
<polyline points="75,1000 42,1000 42,725 65,725" fill="none" stroke="#C64949" stroke-width="2"/>
<polygon points="62,719 62,731 72,725" fill="#C64949"/>

<rect x="680" y="225" width="450" height="120" rx="16" fill="#EAF2FC" stroke="#256BB7" stroke-width="2"/>
<text x="905" y="263" font-size="26" text-anchor="middle" font-weight="700">绑定身份，只提交一次</text>
<text x="905" y="301" font-size="23" text-anchor="middle"><tspan x="905">世界／回合／完整单位 ID</tspan><tspan x="905" dy="31">城市／项目／请求 token</tspan></text>
<line x1="905" y1="345" x2="905" y2="380" stroke="#256BB7" stroke-width="2"/><polygon points="899,376 911,376 905,386" fill="#256BB7"/>
<rect x="680" y="395" width="450" height="90" rx="16" fill="#FFFFFF" stroke="#84A4C8" stroke-width="2"/>
<text x="905" y="432" font-size="25" text-anchor="middle"><tspan x="905">等待原生事件与状态</tspan><tspan x="905" dy="34">事件乱序不等于执行失败</tspan></text>
<line x1="905" y1="485" x2="905" y2="519" stroke="#256BB7" stroke-width="2"/><polygon points="899,515 911,515 905,525" fill="#256BB7"/>
<polygon points="905,535 1125,600 905,665 685,600" fill="#EAF2FC" stroke="#256BB7" stroke-width="2"/>
<text x="905" y="590" font-size="25" text-anchor="middle"><tspan x="905">劳动力消耗＋项目推进</tspan><tspan x="905" dy="34">共同确认？</tspan></text>
<polyline points="1125,600 1163,600 1163,1080 1138,1080" fill="none" stroke="#25836A" stroke-width="2"/>
<polygon points="1140,1074 1140,1086 1130,1080" fill="#25836A"/>
<text x="1158" y="575" font-size="22" fill="#25836A" text-anchor="end">是</text>
<line x1="905" y1="665" x2="905" y2="715" stroke="#256BB7" stroke-width="2"/><polygon points="899,711 911,711 905,721" fill="#256BB7"/>
<text x="920" y="697" font-size="22" fill="#546579">否：保持未决</text>
<rect x="680" y="735" width="450" height="110" rx="16" fill="#FFF5DF" stroke="#C39B42" stroke-width="2"/>
<text x="905" y="772" font-size="25" text-anchor="middle"><tspan x="905">若被弹窗暂停：显式关闭</tspan><tspan x="905" dy="34">只释放 UI 事件，不清除未决</tspan></text>
<polyline points="680,790 645,790 645,440 670,440" fill="none" stroke="#256BB7" stroke-width="2"/>
<polygon points="667,434 667,446 677,440" fill="#256BB7"/>
<text x="680" y="875" font-size="22" fill="#205E9E">↖ 继续确认原请求，绝不重发</text>
<line x1="905" y1="890" x2="905" y2="915" stroke="#8A97A8" stroke-width="2"/><polygon points="899,911 911,911 905,921" fill="#8A97A8"/>
<rect x="680" y="935" width="450" height="75" rx="16" fill="#F0F3F7" stroke="#8A97A8" stroke-width="2"/>
<text x="905" y="966" font-size="24" text-anchor="middle"><tspan x="905">仍无法确认：保留保护门禁</tspan><tspan x="905" dy="31">决定恢复后，显式进入</tspan></text>
<rect x="680" y="1045" width="450" height="70" rx="35" fill="#E6F4EF" stroke="#25836A" stroke-width="2"/>
<text x="905" y="1089" font-size="26" font-weight="700" text-anchor="middle" fill="#206953">原请求确认完成，继续任务</text>

<line x1="50" y1="1150" x2="1150" y2="1150" stroke="#D6DEE8" stroke-width="2"/>
<text x="50" y="1188" font-size="24" font-weight="700">实战事实</text>
<text x="190" y="1188" font-size="23">T191：6 劳动力 → 项目 374→530</text>
<text x="190" y="1226" font-size="23">T231：标准 UI 关闭弹窗后，原贡献确认项目 0→110</text>
</g>
</svg>
