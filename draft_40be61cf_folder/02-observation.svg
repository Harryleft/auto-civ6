<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970">
<rect width="1200" height="970" fill="#FFFFFF"/>
<text x="50" y="46" font-size="28" font-weight="700" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif">案例一：把规则解释与当前可执行资格分开</text>
<text x="50" y="83" font-size="20" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif">旧图表示已发现的缺陷路径；右侧包含输入修复与模型决策两种不同责任</text>
<text x="305" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#B54949" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305" dy="0">修复前：静态候选失真</tspan></text>
<text x="900" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#19766E" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900" dy="0">修复后：规则＋事实＋原生资格</tspan></text>
<rect x="75" y="185" width="460" height="100" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="227.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">按静态先决关系</tspan><tspan x="305.0" dy="32">推导可研究候选</tspan></text>
<rect x="75" y="370" width="460" height="100" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="412.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">候选显示“可选”</tspan><tspan x="305.0" dy="32">本局随机树未必允许</tspan></text>
<rect x="75" y="555" width="460" height="110" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="602.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">输入与原生资格冲突</tspan><tspan x="305.0" dy="32">模型可能据此误判</tspan></text>
<rect x="675" y="185" width="450" height="100" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="900.0" y="227.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">世界知识解释机制</tspan><tspan x="900.0" dy="32">查询本局候选与动态状态</tspan></text>
<polygon points="900,352.5 1065.0,425 900,497.5 735.0,425" fill="#FFF8E8" stroke="#A86D1A" stroke-width="2"/><text x="900" y="416" text-anchor="middle" font-size="23" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900" dy="0">原生资格</tspan><tspan x="900" dy="32">是否明确允许？</tspan></text>
<rect x="660" y="625" width="470" height="100" rx="15" fill="#EFF8F5" stroke="#19766E" stroke-width="2"/><text x="895.0" y="667.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="895.0" dy="0">允许：Agent 比较瓶颈</tspan><tspan x="895.0" dy="32">决定做什么、是否值得做</tspan></text>
<rect x="660" y="810" width="470" height="100" rx="15" fill="#FFF8E8" stroke="#A86D1A" stroke-width="2"/><text x="895.0" y="852.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="895.0" dy="0">不允许／未知：返回限制</tspan><tspan x="895.0" dy="32">不提交研究动作</tspan></text>
<polyline points="305,285 305,370" fill="none" stroke="#B54949" stroke-width="2.4"/><polygon points="305,370 300.0,358.0 310.0,358.0" fill="#B54949"/>
<polyline points="305,470 305,555" fill="none" stroke="#B54949" stroke-width="2.4"/><polygon points="305,555 300.0,543.0 310.0,543.0" fill="#B54949"/>
<polyline points="900,285 900,352" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="900,352 895.0,340.0 905.0,340.0" fill="#19766E"/>
<polyline points="900,497 900,625" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="900,625 895.0,613.0 905.0,613.0" fill="#19766E"/><text x="952" y="565" text-anchor="middle" font-size="20" font-weight="400" fill="#19766E" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="952" dy="0">允许</tspan></text>
<polyline points="1065,425 1170,425 1170,860 1130,860" fill="none" stroke="#A86D1A" stroke-width="2.4"/><polygon points="1130,860 1142.0,855.0 1142.0,865.0" fill="#A86D1A"/><text x="1106" y="565" text-anchor="middle" font-size="20" font-weight="400" fill="#A86D1A" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="1106" dy="0">否／未知</tspan></text>
<text x="305" y="739" text-anchor="middle" font-size="24" font-weight="400" fill="#B54949" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305" dy="0">T195：静态列表可选</tspan><tspan x="305" dy="32">原生 CanProgress=false</tspan></text>
<text x="600" y="949" text-anchor="middle" font-size="20" font-weight="400" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600" dy="0">资格正确解决“能否做”；胜利路线仍由模型依据目标、资源和对手进度判断。</tspan></text>
</svg>