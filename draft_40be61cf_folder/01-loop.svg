<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
<rect width="1200" height="880" fill="#FFFFFF"/>
<text x="50" y="46" font-size="28" font-weight="700" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif">整体机制：模型负责取舍，Harness 负责可信执行</text>
<text x="50" y="83" font-size="20" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif">蓝色：模型与判断　青色：执行与确认　黄色：未决保护</text>
<rect x="60" y="140" width="300" height="105" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="210.0" y="184.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="210.0" dy="0">按需读取规则</tspan><tspan x="210.0" dy="32">与本局动态事实</tspan></text>
<rect x="60" y="325" width="300" height="105" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="210.0" y="369.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="210.0" dy="0">识别目标和瓶颈</tspan><tspan x="210.0" dy="32">比较行动／保持原状</tspan></text>
<rect x="450" y="325" width="300" height="105" rx="15" fill="#EFF8F5" stroke="#19766E" stroke-width="2"/><text x="600.0" y="369.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600.0" dy="0">核对原生资格</tspan><tspan x="600.0" dy="32">检查未决与身份</tspan></text>
<rect x="840" y="325" width="300" height="105" rx="15" fill="#EFF8F5" stroke="#19766E" stroke-width="2"/><text x="990.0" y="369.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="990.0" dy="0">单次提交</tspan><tspan x="990.0" dy="32">等待原生事件和回读</tspan></text>
<polygon points="600,477.5 715.0,540 600,602.5 485.0,540" fill="#FFF8E8" stroke="#A86D1A" stroke-width="2"/><text x="600" y="547" text-anchor="middle" font-size="23" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600" dy="0">结果是哪一种？</tspan></text>
<rect x="60" y="680" width="300" height="105" rx="15" fill="#EFF8F5" stroke="#19766E" stroke-width="2"/><text x="210.0" y="724.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="210.0" dy="0">已确认</tspan><tspan x="210.0" dy="32">更新事实与判断</tspan></text>
<rect x="450" y="680" width="300" height="105" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="600.0" y="724.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600.0" dy="0">明确未提交</tspan><tspan x="600.0" dy="32">解释限制，重选行动</tspan></text>
<rect x="840" y="680" width="300" height="105" rx="15" fill="#FFF8E8" stroke="#A86D1A" stroke-width="2"/><text x="990.0" y="724.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="990.0" dy="0">结果未知</tspan><tspan x="990.0" dy="32">保留未决，只确认原请求</tspan></text>
<polyline points="210,245 210,325" fill="none" stroke="#738197" stroke-width="2.4"/><polygon points="210,325 205.0,313.0 215.0,313.0" fill="#738197"/>
<polyline points="360,377 450,377" fill="none" stroke="#738197" stroke-width="2.4"/><polygon points="450,377 438.0,382.0 438.0,372.0" fill="#738197"/>
<polyline points="750,377 840,377" fill="none" stroke="#738197" stroke-width="2.4"/><polygon points="840,377 828.0,382.0 828.0,372.0" fill="#738197"/>
<polyline points="990,430 990,455 600,455 600,477" fill="none" stroke="#738197" stroke-width="2.4"/><polygon points="600,477 595,465 605,465" fill="#738197"/>
<polyline points="485,540 210,540 210,680" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="210,680 205.0,668.0 215.0,668.0" fill="#19766E"/><text x="330" y="520" text-anchor="middle" font-size="20" font-weight="400" fill="#19766E" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="330" dy="0">确认完成</tspan></text>
<polyline points="600,602 600,680" fill="none" stroke="#285EA8" stroke-width="2.4"/><polygon points="600,680 595.0,668.0 605.0,668.0" fill="#285EA8"/><text x="678" y="646" text-anchor="middle" font-size="20" font-weight="400" fill="#285EA8" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="678" dy="0">没有执行</tspan></text>
<polyline points="715,540 795,540 795,732 840,732" fill="none" stroke="#A86D1A" stroke-width="2.4"/><polygon points="840,732 828.0,737.0 828.0,727.0" fill="#A86D1A"/><text x="880" y="520" text-anchor="middle" font-size="20" font-weight="400" fill="#A86D1A" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="880" dy="0">证据不足</tspan></text>
<polyline points="60,732 28,732 28,192 60,192" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="60,192 48.0,197.0 48.0,187.0" fill="#19766E"/>
<text x="600" y="838" text-anchor="middle" font-size="20" font-weight="400" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600" dy="0">未知时按当前状态显式处理交互或恢复；不因超时自动重发，也不自动选择策略。</tspan></text>
</svg>