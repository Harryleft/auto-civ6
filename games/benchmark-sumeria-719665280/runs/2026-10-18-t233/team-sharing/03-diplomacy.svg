<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100">
<rect width="1200" height="1100" fill="#FFFFFF"/>
<text x="50" y="46" font-size="28" font-weight="700" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif">案例二：一次外交交易，是多个异步阶段</text>
<text x="50" y="83" font-size="20" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif">评估愿意、反提案与最终成交分别确认；确认必须绑定原世界、会话、参与方与动作</text>
<text x="305" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#B54949" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305" dy="0">旧缺陷路径</tspan></text>
<text x="900" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#19766E" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900" dy="0">修复后的阶段与证据</tspan></text>
<rect x="75" y="185" width="460" height="95" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="240.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">发起交易请求</tspan></text>
<rect x="75" y="365" width="460" height="95" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="420.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">立即读一次缓存</tspan></text>
<polygon points="305,515.0 490.0,590 305,665.0 120.0,590" fill="#FFF8E8" stroke="#B54949" stroke-width="2"/><text x="305" y="581" text-anchor="middle" font-size="23" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305" dy="0">评估被误作成交</tspan><tspan x="305" dy="32">或会话提前关闭</tspan></text>
<rect x="75" y="800" width="460" height="120" rx="15" fill="#FCF1F1" stroke="#B54949" stroke-width="2"/><text x="305.0" y="852.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="305.0" dy="0">直接隐藏窗口</tspan><tspan x="305.0" dy="32">引擎事件可能仍未释放</tspan></text>
<rect x="675" y="185" width="450" height="95" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="900.0" y="224.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">绑定当前世界与会话</tspan><tspan x="900.0" dy="32">单次发起评估</tspan></text>
<rect x="675" y="350" width="450" height="95" rx="15" fill="#FFF8E8" stroke="#A86D1A" stroke-width="2"/><text x="900.0" y="389.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">等待匹配的原生回应</tspan><tspan x="900.0" dy="32">无证据则保留未决</tspan></text>
<rect x="675" y="515" width="450" height="95" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="900.0" y="554.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">确认评估／拒绝／反提案</tspan><tspan x="900.0" dy="32">不报告最终成交</tspan></text>
<rect x="675" y="680" width="450" height="95" rx="15" fill="#F1F6FC" stroke="#285EA8" stroke-width="2"/><text x="900.0" y="719.5" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">Agent 显式选择下一步</tspan><tspan x="900.0" dy="32">试价、接受或退出</tspan></text>
<rect x="675" y="845" width="450" height="120" rx="15" fill="#EFF8F5" stroke="#19766E" stroke-width="2"/><text x="900.0" y="881.0" text-anchor="middle" font-size="24" font-weight="400" fill="#243247" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="900.0" dy="0">分别确认结果与退出</tspan><tspan x="900.0" dy="32">原生 Close 释放事件</tspan><tspan x="900.0" dy="32">再确认原回合请求</tspan></text>
<polyline points="305,280 305,365" fill="none" stroke="#B54949" stroke-width="2.4"/><polygon points="305,365 300.0,353.0 310.0,353.0" fill="#B54949"/>
<polyline points="305,460 305,515" fill="none" stroke="#B54949" stroke-width="2.4"/><polygon points="305,515 300.0,503.0 310.0,503.0" fill="#B54949"/>
<polyline points="305,665 305,800" fill="none" stroke="#B54949" stroke-width="2.4"/><polygon points="305,800 300.0,788.0 310.0,788.0" fill="#B54949"/>
<polyline points="900,280 900,350" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="900,350 895.0,338.0 905.0,338.0" fill="#19766E"/>
<polyline points="900,445 900,515" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="900,515 895.0,503.0 905.0,503.0" fill="#19766E"/>
<polyline points="900,610 900,680" fill="none" stroke="#738197" stroke-width="2.4"/><polygon points="900,680 895.0,668.0 905.0,668.0" fill="#738197"/>
<polyline points="900,775 900,845" fill="none" stroke="#19766E" stroke-width="2.4"/><polygon points="900,845 895.0,833.0 905.0,833.0" fill="#19766E"/>
<text x="600" y="1035" text-anchor="middle" font-size="20" font-weight="400" fill="#596579" font-family="Noto Sans SC, PingFang SC, sans-serif"><tspan x="600" dy="0">等待较长只是一项观测；原生阶段、待办、完成标志和读取错误共同决定后续处理。</tspan></text>
</svg>