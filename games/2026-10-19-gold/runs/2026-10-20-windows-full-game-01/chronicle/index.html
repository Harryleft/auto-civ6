  &lt;p class=&quot;ec-source text-small text-muted&quot;&gt;叙事取自原局逐回合记录，未编造人物对话。普通回合若没有单独记下取舍，明确沿用阶段记录。后续巨作修复测试不并入这部原局编年史。&lt;/p&gt;

  &lt;script type=&quot;application/json&quot; id=&quot;ec-data&quot;&gt;{&quot;chapters&quot;:[{&quot;a&quot;:1,&quot;b&quot;:21,&quot;title&quot;:&quot;河畔的第一盏灯&quot;,&quot;kicker&quot;:&quot;落脚&quot;,&quot;story&quot;:&quot;最初，帝国只有一支开拓者和一名勇士。乌鲁克在河畔落脚，勇士走进西侧尚未熟悉的土地。这里没有神级对手的先发优势：第一座城要养人，要造侦察兵，还要给未来留下一条信仰之路。圣地终于立起时，它还只是一个小国。但一片原本陌生的土地，已经开始有了家的轮廓。&quot;,&quot;choice&quot;:&quot;先认识这片土地，再让城市扎根。&quot;,&quot;pivot&quot;:&quot;河流、资源与可见蛮族，决定最初的脚步。&quot;},{&quot;a&quot;:22,&quot;b&quot;:39,&quot;title&quot;:&quot;路口的阴影&quot;,&quot;kicker&quot;:&quot;求生&quot;,&quot;story&quot;:&quot;侦察兵带回了两个新名字：巴西和加拿大。世界忽然变大，帝国却先被外交会话卡住了。解决这道技术关隘后，更真实的危险出现在移民路上——蛮族就在前方。于是军队回身护送，扩张改道。西巴尔终于建成，儒教也在这一阶段成立。帝国没有一往无前地冲出去；它是几次停下、看清，再走到了第二座城。&quot;,&quot;choice&quot;:&quot;扩张可以改道，移民不能白白失去。&quot;,&quot;pivot&quot;:&quot;新外交、蛮族威胁与信仰名额，让计划接连转弯。&quot;},{&quot;a&quot;:40,&quot;b&quot;:71,&quot;title&quot;:&quot;四个名字，一片故土&quot;,&quot;kicker&quot;:&quot;成形&quot;,&quot;story&quot;:&quot;埃利都在第三次落城时加入了帝国，伊辛随后成为第四个名字。学院、神社、改良与商路，让这些名字逐渐有了分量。狭窄的空间也开始显出边界：原定的新城位置被香港的单位占据，落点只能调整。宗教传播的回读曾经失真，侦察兵也曾几乎被蛮族打垮。四城的版图不是一笔画成，而是一段段试探出来的。&quot;,&quot;choice&quot;:&quot;用可守住的四座城，支撑一个更远的目标。&quot;,&quot;pivot&quot;:&quot;邻地、落点和传播效果，都必须回到现场核对。&quot;},{&quot;a&quot;:72,&quot;b&quot;:110,&quot;title&quot;:&quot;书籍与商路&quot;,&quot;kicker&quot;:&quot;积蓄&quot;,&quot;story&quot;:&quot;四座城已经成形，帝国需要的却远不止更多城墙。大学接过学院的工作，商人把粮食和生产送进新城，也把金币带回国库。香港和非斯不再只是地图上的邻居，它们的宗主收益成为发展的支点。世界议会带来另一种竞争：帝国开始把声望转成外交胜利点。然后，在一次保存之后，游戏本身崩溃了。编年史暂停，但这一局并没有重开。&quot;,&quot;choice&quot;:&quot;把邻居、知识与贸易，变成狭小国土之外的力量。&quot;,&quot;pivot&quot;:&quot;科研差距仍在，发展必须同时借助国内与外部网络。&quot;},{&quot;a&quot;:111,&quot;b&quot;:140,&quot;title&quot;:&quot;信仰的围城&quot;,&quot;kicker&quot;:&quot;守心&quot;,&quot;story&quot;:&quot;战火尚未到来，信仰先越过了边界。首都和西巴尔被新教转化，帝国调动审判官与可合法行动的军队，逐城恢复本教。另一条战线没有旗帜：间谍潜入巴西，带回科技提升，也会被发现、被迫逃离。摩诃菩提寺与议会增加了外交点数。连宏大的规划也必须接受现实——本局不存在可用的自由女神像，就不能把它继续写进未来。&quot;,&quot;choice&quot;:&quot;守住信仰与城市，也让计划服从本局真正存在的规则。&quot;,&quot;pivot&quot;:&quot;城市多数信仰、间谍归途、奇观可用性，都不能凭想当然。&quot;},{&quot;a&quot;:141,&quot;b&quot;:168,&quot;title&quot;:&quot;和平被撕开的那一天&quot;,&quot;kicker&quot;:&quot;受创&quot;,&quot;story&quot;:&quot;布达拉宫落成，城墙逐座加固，帝国还在盘算香港究竟值不值得保留。和平扩地已经带来部分新土地，项目加成与宗主收益仍有用处，因此没有为了挤出几格空间发动征服。随后，巴西突袭。科研与外交的计划被迫让位给眼前的城防：补兵、射击、守住家园。直到原生和平在第168回合被接受，这段战争才真正告一段落。损失被保留，故事没有倒带。&quot;,&quot;choice&quot;:&quot;先保住四座城，让明天仍有发展可言。&quot;,&quot;pivot&quot;:&quot;突袭让建设优先级转成守城优先级。&quot;},{&quot;a&quot;:169,&quot;b&quot;:190,&quot;title&quot;:&quot;抬头，别人已在星空下&quot;,&quot;kicker&quot;:&quot;追赶&quot;,&quot;story&quot;:&quot;战后，建造者重新走向田野，交易和援助项目恢复。可世界没有等这个小国喘息：巴西的太空工程已经领先。火箭研究完成后，乌鲁克开始修建自己的宇航中心。与此同时，间谍被派去破坏对手的宇航工程，为追赶争取时间。艺术家和作家仍未能创作，这是这一阶段没有解决的缺口。另一则坏消息接踵而来：香港的宗主权也丢了。&quot;,&quot;choice&quot;:&quot;一面修自己的发射台，一面减缓对手的脚步。&quot;,&quot;pivot&quot;:&quot;太空差距和宗主权变化，迫使帝国重新分配资源。&quot;},{&quot;a&quot;:191,&quot;b&quot;:207,&quot;title&quot;:&quot;把工匠送上发射台&quot;,&quot;kicker&quot;:&quot;跃迁&quot;,&quot;story&quot;:&quot;帝国改用共产主义，调整政策，让有限的城市更有效地工作。萨拉姆带来了一批真实核验过的科技提升，阿玛妮转赴香港，重新争回项目生产收益。宇航中心终于落成，皇家学会把建造者的劳动力送进太空项目。第一颗卫星进入轨道时，曾经由勇士一点点探索的世界，以另一种方式被看见。可是，巴西的第二次突袭紧接着到来。&quot;,&quot;choice&quot;:&quot;让城市、总督、伟人与工匠，共同托起太空工程。&quot;,&quot;pivot&quot;:&quot;每一次贡献都要验证进度；每一次突破都可能伴随新威胁。&quot;},{&quot;a&quot;:208,&quot;b&quot;:218,&quot;title&quot;:&quot;炮火中的倒计时&quot;,&quot;kicker&quot;:&quot;坚持&quot;,&quot;story&quot;:&quot;军队在地面承受攻击，工匠仍在宇航中心周围轮换。登月完成，火星工程接着启动。两名间谍在同一回合传回宇航破坏成功的通知，但帝国也失去了胸甲骑兵，先前还有桨帆船等战损。一次控制区移动又卡住了工具确认；修复后，继续的是带着这些损失的同一局。和平到来，火星殖民随后完成。帝国守住的，不只是城墙，还有继续发射的能力。&quot;,&quot;choice&quot;:&quot;让防守争取时间，让工程把时间变成进度。&quot;,&quot;pivot&quot;:&quot;成功与损失同时发生，技术恢复不能抹去战果。&quot;},{&quot;a&quot;:219,&quot;b&quot;:228,&quot;title&quot;:&quot;群星之外，仍有尘世&quot;,&quot;kicker&quot;:&quot;远航&quot;,&quot;story&quot;:&quot;一批批建造者接力，系外探索终于完成。飞船离开发射台，开始了尚未结束的漫长旅行。地面上的世界却同样重要：援助瑞典的竞赛带来外交点数，香港的项目加成继续发挥作用，黄金时代又给了帝国一台机甲。甚至一份铀收入摘要也必须重新查清——若连自己的补给都看错，钢铁巨人就无法成为可靠的守护者。&quot;,&quot;choice&quot;:&quot;仰望星空，同时照料仍会受伤的地上家园。&quot;,&quot;pivot&quot;:&quot;飞船已经出发，外交路线也已接近终点。&quot;},{&quot;a&quot;:229,&quot;b&quot;:238,&q :&quot;&quot;,&quot;resource&quot;:&quot;&quot;},{&quot;x&quot;:34,&quot;y&quot;:30,&quot;terrain&quot;:&quot;OCEAN&quot;,&quot;seen&quot;:124,&quot;feature&quot;:&quot;&quot;,&quot;resource&quot;:&quot;&quot;}]}&lt;/script&gt;
  &lt;script&gt;
  (() =&gt; {
    &quot;use strict&quot;;
    const root = document.getElementById(&quot;empire-chronicle&quot;);
    const data = JSON.parse(root.querySelector(&quot;#ec-data&quot;).textContent);
    const el = id =&gt; root.querySelector(&quot;#&quot; + id);
    const slider = el(&quot;ec-turn&quot;);
    const chapterSelect = el(&quot;ec-chapter&quot;);
    const scene = root.querySelector(&quot;.ec-scene&quot;);
    const timeline = root.querySelector(&quot;.ec-timeline&quot;);
    const ns = &quot;http://www.w3.org/2000/svg&quot;;
    let turn = 1;
    const wars = [{a:158,b:168,n:&quot;第一次战争&quot;},{a:207,b:216,n:&quot;第二次战争&quot;},{a:229,b:238,n:&quot;第三次战争&quot;}];
    const cities = [
      {name:&quot;乌鲁克&quot;,x:40,y:25,born:1,tag:&quot;河畔首都&quot;},
      {name:&quot;西巴尔&quot;,x:36,y:24,born:38,tag:&quot;西部支点&quot;},
      {name:&quot;埃利都&quot;,x:42,y:29,born:49,tag:&quot;第三座城&quot;},
      {name:&quot;伊辛&quot;,x:37,y:28,born:71,tag:&quot;海岸新城&quot;}
    ];
    data.chapters.forEach((c,i) =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = String(i);
      option.textContent = &quot;卷&quot; + String(i+1) + &quot; · &quot; + c.title;
      chapterSelect.appendChild(option);
    });
    function node(tag,attrs,text) {
      const v = document.createElementNS(ns,tag);
      Object.entries(attrs || {}).forEach(([k,a]) =&gt; v.setAttribute(k,String(a)));
      if (text !== undefined) v.textContent = text;
      return v;
    }
    function storyState() {
      if (turn === 243) return &quot;外交胜利已经确认，命令到此停止。&quot;;
      if (turn &gt;= 223) return &quot;飞船已出发，尚未抵达；地上的故事仍在继续。&quot;;
      if (turn &gt;= 218) return &quot;火星工程完成，工匠正接力推动系外探索。&quot;;
      if (turn &gt;= 210) return &quot;登月完成，下一站是火星。&quot;;
      if (turn &gt;= 206) return &quot;卫星已经入轨，登月工程接着前行。&quot;;
      if (turn &gt;= 201) return &quot;宇航中心落成，第一颗卫星正在准备。&quot;;
      if (turn &gt;= 179) return &quot;乌鲁克正在修建自己的宇航中心。&quot;;
      if (turn &gt;= 71) return &quot;四座城从此守到终局，边界之外还有更大的世界。&quot;;
      if (turn &gt;= 49) return &quot;埃利都加入家园，第四座城尚在前方。&quot;;
      if (turn &gt;= 38) return &quot;西巴尔与乌鲁克，共同撑起年轻的帝国。&quot;;
      return &quot;从一座河畔城市开始，土地还在被认识。&quot;;
    }
    function drawScene() {
      const w = Math.max(280,Math.round(scene.getBoundingClientRect().width));
      const h = w &lt; 420 ? 336 : 420;
      scene.style.height = h + &quot;px&quot;;
      scene.setAttribute(&quot;viewBox&quot;,&quot;0 0 &quot; + w + &quot; &quot; + h);
      scene.replaceChildren();
      scene.append(node(&quot;title&quot;,{id:&quot;ec-scene-title&quot;},&quot;第&quot; + turn + &quot;回合的家园与初见地形复原&quot;));
      const activeCities = cities.filter(c =&gt; c.born &lt;= turn);
      scene.append(node(&quot;desc&quot;,{id:&quot;ec-scene-desc&quot;},activeCities.map(c =&gt; c.name).join(&quot;、&quot;) + &quot;已建立。底图取自原局地形初见记录，空白仅代表日志未覆盖；不表示领土或实时战争态势。&quot;));
      const war = wars.find(x =&gt; turn &gt;= x.a &amp;&amp; turn &lt; x.b);
      scene.append(node(&quot;text&quot;,{x:0,y:17},war ? war.n + &quot; · 四城的保卫战&quot; : turn===243 ? &quot;四城仍在 · 外交胜利&quot; : &quot;河海之间的家园&quot;));
      const r = Math.min((w-30)/(Math.sqrt(3)*11.5),(h-96)/18);
      const dx = Math.sqrt(3)*r;
      const mapW = dx*11.5;
      const left = (w-mapW)/2+dx/2;
      const top = 51+r;
      const x = (vx,vy) =&gt; left+(vx-34+(vy%2)*0.5)*dx;
      const y = vy =&gt; top+(vy-21)*1.5*r;
      const hex = (cx,cy) =&gt; Array.from({length:6},(_,i) =&gt; {
        const angle=(60*i-30)*Math.PI/180;
        return (cx+r*Math.cos(angle))+&quot;,&quot;+(cy+r*Math.sin(angle));
      }).join(&quot; &quot;);
      const occupied = new Set(activeCities.map(c=&gt;c.x+&quot;,&quot;+c.y));
      const resources = {RICE:&quot;稻&quot;,CITRUS:&quot;柑&quot;,IVORY:&quot;象&quot;,HORSES:&quot;马&quot;,WHEAT:&quot;麦&quot;,FISH:&quot;鱼&quot;,CRABS:&quot;蟹&quot;,IRON:&quot;铁&quot;,COAL:&quot;煤&quot;,BANANAS:&quot;蕉&quot;,STONE:&quot;石&quot;};
      data.tiles.filter(t=&gt;t.seen&lt;=turn).forEach(t=&gt;{
        const cx=x(t.x,t.y),cy=y(t.y);
        const water=t.terrain===&quot;COAST&quot;||t.terrain===&quot;OCEAN&quot;;
        const mountain=t.terrain.includes(&quot;MOUNTAIN&quot;);
        const fill=water?&quot;color-mix(in srgb, var(--viz-series-1) 20%, transparent)&quot;:mountain?&quot;color-mix(in srgb, var(--foreground) 15%, transparent)&quot;:&quot;color-mix(in srgb, var(--viz-series-3) 19%, transparent)&quot;;
        scene.append(node(&quot;polygon&quot;,{points:hex(cx,cy),fill,stroke:&quot;var(--background)&quot;,&quot;stroke-width&quot;:1}));
        if(!occupied.has(t.x+&quot;,&quot;+t.y)) {
          const label=mountain?&quot;山&quot;:resources[t.resource]||(!water?t.feature:&quot;&quot;);
          if(label)scene.append(node(&quot;text&quot;,{x:cx,y:cy+4,&quot;text-anchor&quot;:&quot;middle&quot;},label));
        }
      });
      activeCities.forEach(c=&gt;{
        const cx=x(c.x,c.y),cy=y(c.y);
        scene.append(node(&quot;circle&quot;,{cx,cy,r:7,fill:&quot;var(--foreground)&quot;}));
        scene.append(node(&quot;circle&quot;,{cx,cy,r:3,fill:&quot;var(--background)&quot;}));
        const onRight=c.name===&quot;埃利都&quot;||c.name===&quot;乌鲁克&quot;;
        const labelX=onRight?cx+12:cx-12;
        const anchor=onRight?&quot;start&quot;:&quot;end&quot;;
        scene.append(node(&quot;rect&quot;,{x:onRight?labelX-3:labelX-51,y:cy-10,width:54,height:21,rx:2,fill:&quot;var(--background)&quot;}));
        scene.append(node(&quot;text&quot;,{x:labelX,y:cy+5,&quot;text-anchor&quot;:anchor},c.name));
      });
      const legendY=h-26;
      const entries=[[&quot;水域&quot;,&quot;var(--viz-series-1)&quot;],[&quot;陆地&quot;,&quot;var(--viz-series-3)&quot;],[&quot;山地&quot;,&quot;var(--foreground)&quot;]];
      const legendStart=Math.max(0,(w-216)/2);
      entries.forEach(([label,color],i)=&gt;{
        const lx=legendStart+i*76;
        scene.append(node(&quot;rect&quot;,{x:lx,y:legendY-8,width:9,height:9,rx:1,fill:color,opacity:0.6}));
        scene.append(node(&quot;text&quot;,{x:lx+15,y:legendY},label));
      });
      el(&quot;ec-scene-caption&quot;).textContent=&quot;城址与地形示意：按原局初见记录复原，不显示实时疆界、改良或战线。&quot;;
    }
    function drawTimeline() {
      const w=Math.max(280,Math.round(timeline.getBoundingClientRect().width)),p=4;
      timeline.setAttribute(&quot;viewBox&quot;,&quot;0 0 &quot;+w+&quot; 58&quot;);
      timeline.replaceChildren();
      const x=t=&gt;p+(t-1)/242*(w-2*p);
      data.chapters.forEach((c,i) =&gt; {
        timeline.append(node(&quot;rect&quot;,{x:x(c.a),y:8,width:Math.max(1,x(c.b)-x(c.a)),height:8,rx:2,fill:turn&gt;=c.a&amp;&amp;turn&lt;=c.b?&quot;var(--viz-series-1)&quot;:&quot;var(--muted)&quot;}));
      });
      wars.forEach(c=&gt;timeline.append(node(&quot;rect&quot;,{x:x(c.a),y:23,width:x(c.b)-x(c.a),height:4,rx:1,fill:&quot;var(--viz-series-2)&quot;})));
      timeline.append(node(&quot;line&quot;,{x1:x(turn),y1:3,x2:x(turn),y2:32,stroke:&quot;var(--foreground)&quot;,&quot;stroke-width&quot;:1}));
      timeline.append(node(&quot;text&quot;,{x:4,y:51},&quot;河畔起步&quot;));
      timeline.append(node(&quot;text&quot;,{x:w-4,y:51,&quot;text-anchor&quot;:&quot;end&quot;},&quot;外交终章&quot;));
      const legendX = w/2;
      timeline.append(node(&quot;rect&quot;,{x:legendX-28,y:42,width:12,height:4,rx:1,fill:&quot;var(--viz-series-2)&quot;}));
      timeline.append(node(&quot;text&quot;,{x:legendX-10,y:51},&quot;战争&quot;));
    }
    function persist() {
      if (window.openai &amp;&amp; window.openai.setWidgetState) {
        window.openai.setWidgetState({
          modelContent:{originalGameTurn:turn,chapter:data.chapters.find(c=&gt;turn&gt;=c.a&amp;&amp;turn&lt;=c.b).title},
          privateContent:{turn,foldOpen:root.querySelector(&quot;details&quot;).open}
        }).catch(()=&gt;{});
      }
    }
    function render(next,save) {
      const value=Number(next);
      turn=Number.isFinite(value)?Math.min(243,Math.max(1,Math.round(value))):1;
      const day=data.days[turn-1];
      const ci=data.chapters.findIndex(c=&gt;turn&gt;=c.a&amp;&amp;turn&lt;=c.b);
