# DeepSeek Harness overlay for the local civ6-mcp checkout.
# Run DSH from the civ6-mcp repository root so process.cwd() resolves here.
# HMR touch: 2026-08-16b — reload mcp-civ6 (commemoration guard fix)
# (pantheon cost readback, governor type probe, game-speed reporting).
- insert:
    - id: mcp-civ6
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: civ6
        transport: stdio
        command: uv
        args: [run, civ-mcp]
        cwd: !!js process.cwd()
        env:
          CIV_MCP_AGENT_MODEL: deepseek-harness
          CIV_MCP_METADATA: '{}'
          CIV_MCP_SAVE_FILE: ''
          # Keep startup recovery disabled unless the caller explicitly
          # exports CIV_MCP_DSH_AUTO_RESUME=1.
          CIV_MCP_DSH_AUTO_RESUME: !!js "process.env.CIV_MCP_DSH_AUTO_RESUME ?? '0'"
          CIV_MCP_DISABLE_LUA: '1'
          # The play profile is chosen by the caller (scripts/civ6_agent
          # --play-profile) and must reach the MCP child, which is where the
          # decision has to be applied: DSH has no MCP tool allowlist and
          # registers every tool the server advertises, so the child removes
          # the belief/governance control plane from its own surface before
          # answering tools/list.
          CIV_MCP_PLAY_PROFILE: !!js "process.env.CIV_MCP_PLAY_PROFILE ?? 'legacy'"
          # Forwarded unconditionally: blank means "not configured", so the
          # play profile decides the default (legacy -> enforce, lean -> off)
          # and an explicit lean+enforce/observe contradiction still fails
          # loudly in the child instead of being silently overridden here.
          CIV_MCP_BELIEF_MODE: !!js "process.env.CIV_MCP_BELIEF_MODE ?? ''"
        # Deity AI turns can take 5-10 minutes, which is the only thing this has
        # to cover: `civ_mcp.end_turn` derives poll 830s + query reserve 300s =
        # 1130s, and the timeout applies per call, so it must exceed the longest
        # single call — not the sum of a turn plus recovery. Recovery left this
        # call (see RESTART_AND_LOAD_CEILING_SECONDS): keeping three relaunches
        # inside it is what used to force a ~50-minute deadline for an operation
        # whose normal case is seconds, and it hid whether a turn had merely been
        # slow or had been wedged and restarted.
        # tests/test_end_turn_budget.py fails if this ever drops to or below the
        # longest call's ceiling. The flow also enforces that ceiling from the
        # inside and returns a machine-readable "outcome unknown" receipt instead
        # of letting the host kill the call mid-advance.
        toolCallTimeoutMs: 1200000
        failOnStartupError: true
        # Avoid an automatic child restart chain around a single-client
        # FireTuner connection. Restart the DSH host explicitly if civ-mcp exits.
        reconnect:
          enabled: false
