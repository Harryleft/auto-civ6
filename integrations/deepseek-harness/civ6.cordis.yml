# DeepSeek Harness overlay for the local civ6-mcp checkout.
# Run DSH from the civ6-mcp repository root so process.cwd() resolves here.
# HMR touch: 2026-08-16b — reload mcp-civ6 (commemoration guard fix)
# (pantheon cost readback, governor type probe, game-speed reporting).
- insert:
    - id: mcp-civ6
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: civ6
        transport: stdio
        command: uv
        args: [run, civ-mcp]
        cwd: !!js process.cwd()
        env:
          CIV_MCP_AGENT_MODEL: deepseek-harness
          CIV_MCP_METADATA: '{}'
          CIV_MCP_SAVE_FILE: ''
          # Keep startup recovery disabled unless the caller explicitly
          # exports CIV_MCP_DSH_AUTO_RESUME=1.
          CIV_MCP_DSH_AUTO_RESUME: !!js "process.env.CIV_MCP_DSH_AUTO_RESUME ?? '0'"
          CIV_MCP_DISABLE_LUA: '1'
        # Deity AI turns can take 5-10 minutes, and a World Congress turn can
        # legitimately run ~20. This ceiling must exceed the *whole* worst-case
        # end_turn budget, not just the wait loop: civ_mcp.end_turn derives
        # poll 1276s + query reserve 300s + hang-recovery reserve 1845s
        # = 3421s, and tests/test_end_turn_budget.py fails if this number ever
        # drops to or below that total. The flow also enforces the ceiling from
        # the inside and returns a machine-readable "outcome unknown" receipt
        # instead of letting the host kill the call mid-advance.
        toolCallTimeoutMs: 3600000
        failOnStartupError: true
        # Avoid an automatic child restart chain around a single-client
        # FireTuner connection. Restart the DSH host explicitly if civ-mcp exits.
        reconnect:
          enabled: false
