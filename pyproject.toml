[project]
name = "civ6-agent"
version = "1.1.11"
description = "Civilization VI LangGraph agent with a Runtime Core and FireTuner adapter"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Liam Wilkinson", email = "liam.m.wilkinson@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["civ6", "civilization", "mcp", "llm", "agent", "game-ai", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
    "fastapi[standard]>=0.128",
    "anthropic>=0.84.0",
]

[project.optional-dependencies]
evals = [
    "inspect-ai>=0.3.203",
    "openai>=1.0",
    "google-cloud-aiplatform>=1.38",
    "google-genai>=1.69",
]
scout = [
    "inspect-scout>=0.4",
    "inspect-ai>=0.3.203",
]
cloud = [
    "fsspec>=2024.6",
    "adlfs>=2024.7",
]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
# Backward-compat alias for the old project name. It cannot reference
# ``civ6-agent[launcher-macos]`` because a self-referential extra makes
# resolution unsatisfiable; the dependencies are listed directly instead.
launcher = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
analysis = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
]
publish = [
    "fsspec>=2024.6",
    "adlfs>=2024.7",
    "pyarrow>=18.0",
    "huggingface-hub>=1.13",
    "mlcroissant>=1.1",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/lmwilki/civ6-mcp"
Repository = "https://github.com/lmwilki/civ6-mcp"

[project.scripts]
civ-mcp = "civ_mcp.runtime.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civ_mcp", "src/civ_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.10.8",
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Only rules that catch real defects, not style: undefined names, redefinitions,
# assert/exception misuse, and syntax errors. The default rule set reports ~330
# findings here, most of them cosmetic; widening should be incremental so the
# gate stays green and therefore useful.
# F821 already found a reachable NameError in narrate.py (`_describe_trade_item`
# was never defined) and a missing `Any` import in game_state.py.
select = ["E9", "F63", "F7", "F82", "F811", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The console script does not put the invocation directory on sys.path, so
# `pytest` and `python -m pytest` disagreed about whether `evals` (a repo-root
# package consumed by tests/test_scorer.py) was importable. Pin it explicitly.
pythonpath = ["."]
markers = [
    "property: hypothesis 属性测试（随机化不变量）",
    "golden: Lua 生成黄金契约测试",
    "manual: 需要真实游戏实例的手动冒烟测试",
]
