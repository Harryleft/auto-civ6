[project]
name = "civ6-belief-engine"
version = "1.1.11"
description = "Civilization VI Belief Engine with an MCP game adapter"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Liam Wilkinson", email = "liam.m.wilkinson@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["civ6", "civilization", "mcp", "llm", "agent", "game-ai", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
    "fastapi[standard]>=0.128",
    "anthropic>=0.84.0",
]

[project.optional-dependencies]
evals = [
    "inspect-ai>=0.3.203",
    "openai>=1.0",
    "google-cloud-aiplatform>=1.38",
    "google-genai>=1.69",
]
scout = [
    "inspect-scout>=0.4",
    "inspect-ai>=0.3.203",
]
cloud = [
    "fsspec>=2024.6",
    "adlfs>=2024.7",
]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
launcher = ["civ6-belief-engine[launcher-macos]"]  # backward compat alias
analysis = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
]
publish = [
    "fsspec>=2024.6",
    "adlfs>=2024.7",
    "pyarrow>=18.0",
    "huggingface-hub>=1.13",
    "mlcroissant>=1.1",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/lmwilki/civ6-mcp"
Repository = "https://github.com/lmwilki/civ6-mcp"

[project.scripts]
civ-mcp = "civ_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civ_mcp", "src/civ6_belief_engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.10.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The console script does not put the invocation directory on sys.path, so
# `pytest` and `python -m pytest` disagreed about whether `evals` (a repo-root
# package consumed by tests/test_scorer.py) was importable. Pin it explicitly.
pythonpath = ["."]
markers = [
    "property: hypothesis 属性测试（随机化不变量）",
    "golden: Lua 生成黄金契约测试",
    "manual: 需要真实游戏实例的手动冒烟测试",
]

[tool.mutmut]
source_paths = [
    "src/civ6_belief_engine/belief_engine.py",
    "src/civ6_belief_engine/derivation.py",
    "src/civ6_belief_engine/ids.py",
]
# 包内其余模块只复制（供 import）不变异。
also_copy = [
    "src/civ_mcp",
    "src/civ6_belief_engine/__init__.py",
    "src/civ6_belief_engine/belief_mode.py",
    "src/civ6_belief_engine/coverage.py",
    "src/civ6_belief_engine/dashboard.py",
    "src/civ6_belief_engine/forecast",
    "src/civ6_belief_engine/governance",
    "src/civ6_belief_engine/graph",
    "src/civ6_belief_engine/py.typed",
]
pytest_add_cli_args_test_selection = [
    "tests/test_belief_engine.py",
    "tests/test_belief_engine_p0.py",
    "tests/test_derivation.py",
    "tests/test_belief_mode.py",
    "tests/test_belief_coverage.py",
    "tests/test_harness_belief_flow.py",
    "tests/test_belief_mode_server.py",
]
